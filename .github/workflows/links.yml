name: links

# External links, weekly. A broken one opens an issue, or updates the one that is open, and the
# issue is closed when every link works again. External sites fail for their own reasons, so
# this never runs on a pull request. Links inside the site are checked by the links job in
# ci.yml.

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: links
  cancel-in-progress: true

jobs:
  external:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    env:
      DOCS_SITE: ${{ vars.DOCS_SITE || 'https://sluiceway.github.io' }}
      DOCS_BASE: ${{ vars.DOCS_BASE || '/docs' }}
      TITLE: External links are broken
      LABEL: links
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - run: bun install --frozen-lockfile

      - run: bun run build

      # lychee.toml keeps it to http and https links. --root-dir lets lychee read the site's
      # own root-relative links as files, which the scheme filter then skips.
      - id: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --config lychee.toml
            --root-dir ${{ github.workspace }}/dist
            --no-progress
            'dist/**/*.html'
            README.md
          output: lychee/out.md
          fail: false

      - name: Open, update or close the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EXIT_CODE: ${{ steps.lychee.outputs.exit_code }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          number=$(gh issue list --state open --label "$LABEL" --json number,title \
            --jq "map(select(.title == env.TITLE)) | .[0].number // empty")
          if [ "$EXIT_CODE" = "0" ]; then
            if [ -n "$number" ]; then
              gh issue close "$number" --comment "Every external link works again. Checked in $RUN_URL."
            fi
            exit 0
          fi
          {
            echo "The weekly check found external links that do not work. Checked in $RUN_URL."
            echo
            cat lychee/out.md
          } > body.md
          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file body.md
          else
            gh label create "$LABEL" --color 5B8DEF --description "Broken external links" --force
            gh issue create --title "$TITLE" --label "$LABEL" --body-file body.md
          fi
