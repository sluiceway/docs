name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # fetch-depth 0 fetches the submodule's full history with its tags, which
      # src/lib/source.ts needs to read the pinned tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - run: bun install --frozen-lockfile

      - run: bun run check

  links:
    # Builds the site under each address it can live at and checks every link and anchor inside
    # it, offline. External links are checked weekly by links.yml instead.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - site: https://sluiceway.github.io
            base: /docs
          - site: https://docs.sluiceway.dev
            base: /
    name: links (${{ matrix.site }}${{ matrix.base }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - run: bun install --frozen-lockfile

      - run: bun run build
        env:
          DOCS_SITE: ${{ matrix.site }}
          DOCS_BASE: ${{ matrix.base }}

      - run: bun run links
        env:
          DOCS_SITE: ${{ matrix.site }}
          DOCS_BASE: ${{ matrix.base }}

      # The checks of the built site (titles, canonical URLs, sitemap) at this address.
      - run: bun test
        env:
          DOCS_SITE: ${{ matrix.site }}
          DOCS_BASE: ${{ matrix.base }}

  lighthouse:
    # Builds with the production address, serves dist/ the way Pages does (scripts/serve.ts) and
    # runs Lighthouse three times on each URL in lighthouserc.json, as a phone. A median score
    # under 90 for performance, accessibility, best practices or SEO on any URL fails the job.
    # Nobody answers the consent bar here, so Umami never loads.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - run: bun install --frozen-lockfile

      - run: bun run build
        env:
          DOCS_SITE: https://docs.sluiceway.dev
          DOCS_BASE: /

      - run: bun run lighthouse

      - name: Median scores
        if: always()
        run: bun scripts/lighthouse-summary.ts >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: lighthouse
          path: .lighthouseci/
          # The folder's name starts with a dot, which the action skips unless told.
          include-hidden-files: true
          if-no-files-found: error
